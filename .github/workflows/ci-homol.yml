name: Você na Facul Form
on:
  pull_request:
    branches: ['develop']
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Iniciando CI
        run: echo "Iniciando CI"
      - uses: actions/setup-node@v1
        with:
          node-version: 20.x
      - name: Install depends
        run: yarn
      - name: Build app Você na Facul Form
        run: yarn build
      # - name: Run Test app MS Você na Facul Form
      #   run: yarn test
  PUSH:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Checkout develop para a imagem refletir o estado da branch (evita “sumir” em homol)
      - uses: actions/checkout@v3
        with:
          ref: develop
          fetch-depth: 0
      - name: Iniciando PUSH
        run: echo "Iniciando PUSH"
      - uses: actions/setup-node@v1
        with:
          node-version: 20.x
      - name: Install depends
        run: yarn
      - name: Build app vCnafacul
        run: yarn build
      - name: Build Image
        run: docker build -t formsvcnafacul -f form.dockerfile .
      # Tag do commit que virou imagem (o checkout é a ponta da develop): o
      # deploy.sh do vcnafacul-stack sobe exatamente essa, e o rollback volta
      # para a anterior (tickets/056, card 03).
      - name: Tag do commit
        id: tag
        run: echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: docker tags
        run: |
          docker tag formsvcnafacul vcnafacul/form:latest
          docker tag formsvcnafacul vcnafacul/form:${{ steps.tag.outputs.tag }}
      - name: docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
      - name: Image Push
        run: |
          docker push vcnafacul/form:${{ steps.tag.outputs.tag }}
          docker push vcnafacul/form:latest
  DEPLOY_HOMOL:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'develop'
    needs: PUSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy em Homolog (Hostinger)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST_HOMOL }}
          username: ${{ secrets.DEPLOY_USER_HOMOL }}
          password: ${{ secrets.DEPLOY_PASS_HOMOL }}
          # compose do vcnafacul-stack (tickets/056): troca só o form e espera healthy
          script: ~/stack/deploy.sh form ${{ needs.PUSH.outputs.tag }}
